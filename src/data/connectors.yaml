# Connecteurs de Fourmy et de Lyvre — docs/design/04-accueil-kit-connecteurs.md §4 (D32–D34).
#
# Seule source des connecteurs affichés (scène 3D, tableau, repli 2D). L'état est éditorial :
#   stable   : code publié ; `source` (chemin dans github.com/ekylibre/<product>) est obligatoire.
#   en-cours : intégration en développement ou prévue ; ni version ni lien de code.
#
# product  : fourmy | lyvre
# zone     : ancre dans la scène 3D (clé de public/3d/scene.json → zones) ; Fourmy seulement.
#            Les intégrations de Lyvre ne sont que dans le tableau (D34).
# category : machines | meteo | elevage | vigne | finance | gestion | durabilite | terrain
# dataFlow : in (vers le logiciel) | out (depuis le logiciel) | both
#
# Sources de Fourmy vérifiées le 2026-11-08 (gh api repos/ekylibre/fourmy/contents/packages).

# ── Fourmy · stables ─────────────────────────────────────────────────────────
- slug: traccar
  product: fourmy
  status: stable
  category: machines
  zone: hangars
  dataFlow: in
  partner: { name: Traccar, url: 'https://www.traccar.org/' }
  title: { fr: Positions GPS des tracteurs, en: Tractor GPS tracking }
  summary:
    fr: Les positions enregistrées par Traccar (boîtiers, téléphones, AgOpenGPS) arrivent dans Fourmy chaque minute et deviennent des traces rattachées aux interventions.
    en: Positions recorded by Traccar (trackers, phones, AgOpenGPS) reach Fourmy every minute and become tracks linked to interventions.
  source: packages/connector-traccar

- slug: ign
  product: fourmy
  status: stable
  category: terrain
  zone: parcelles
  dataFlow: in
  partner: { name: IGN, url: 'https://www.ign.fr/' }
  title: { fr: Relief, photo et bâtiments, en: Terrain, aerial imagery and buildings }
  summary:
    fr: Le relief, la photographie aérienne et les bâtiments de l’IGN dessinent la ferme en 2D et en 3D dans Fourmy.
    en: IGN terrain, aerial imagery and building data draw the farm in 2D and 3D in Fourmy.
  source: packages/geo-ign

- slug: migration-ekylibre
  product: fourmy
  status: stable
  category: gestion
  zone: hub
  dataFlow: in
  title: { fr: Reprise d’une ferme Ekylibre, en: Ekylibre farm migration }
  summary:
    fr: Parcelles, interventions, stocks et registre phytosanitaire d’une ferme Ekylibre sont repris dans Fourmy, sans ressaisie.
    en: Plots, interventions, stocks and the plant protection register of an Ekylibre farm are carried over into Fourmy, with no re-keying.
  source: packages/migrator-ekylibre

