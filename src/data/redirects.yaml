# B6 — Redirections des anciennes URL d'ekylibre.com (docs/brainstorm/anciennes-urls-ekylibre-com.txt).
# Ancien chemin → nouveau chemin, SANS la base de déploiement (astro.config.mjs l'ajoute).
# Correspondances : docs/brainstorm/01-exigences-site-ekylibre.md §10.
#
# Ne figurent pas ici :
# - les anciens articles repris : redirigés automatiquement vers /actualites/<slug>/
#   grâce au champ `legacyUrl` de src/content/news/ (astro.config.mjs) ;
# - les anciens chemins qui sont aussi des routes du nouveau site
#   (/, /contact/, /cookies/, /developpeurs/, /terms-of-use/).
# scripts/check-content.mjs vérifie que les 129 anciennes URL sont couvertes et que chaque
# cible est une route existante.

