# Kit isométrique — éléments à découper (docs/design/04-accueil-kit-connecteurs.md §5.2).
# rect : [x, y, largeur, hauteur] en unités du SVG converti (grille relevée sur l'aperçu).
# Un objet est gardé si sa boîte est entièrement dans rect et s'il n'est pas dans exclude.
# exclude_fill : couleurs de tracés à écarter ; drop_larger : écarte les objets presque aussi grands
# que le cadre (fond et anneau des médaillons).
# foot : point de contact au sol, en fraction de la boîte (défaut [0.5, 1]).
# Régénérer : python3 -I scripts/kit/extract.py [id…]

